<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Gunmetal / Titanium Base Gradient -->
    <linearGradient id="logoDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>

    <!-- Radiant Cyber Ruby / Crimson Gradient -->
    <linearGradient id="crusaderCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Circular Base: Dark Titanium Plate -->
  <circle cx="256" cy="256" r="256" fill="url(#logoDarkBg)" />

  <!-- Subtle Inner Hairline Borders -->
  <circle cx="256" cy="256" r="254" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="6 8" />

  <!-- Center Hero: Templar Cross (Radiant Crimson on Dark Plate) -->
  <g transform="translate(256, 256) scale(0.95)" fill="url(#crusaderCrossGrad)">
    <use href="#templarCrossSingle" />
  </g>
</svg>
